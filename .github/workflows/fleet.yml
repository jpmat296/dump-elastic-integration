---
name: Run Fleet server and extract Elastic integration
'on':
  pull_request:
  push:

jobs:

  molecule:
    name: Molecule
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version:
          - 8.16.1
        integration:
          - kibana
        distro:
          - ubuntu-22.04

    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v2

      - name: Start containers
        run: |
          cd molecule/setup/es_kb_fleet
          sed -i 's/^STACK_VERSION=.*/STACK_VERSION=${{ matrix.version }}/g' .env
          ./elastic-container.sh start

      - name: Install scripts dependencies.
        run: pip3 install -r ./scripts/requirements.txt

      - name: Run scripts
        run: |
          export VERSION=$(python3 ./scripts/find_integration_version.py ${{ matrix.integration }})
          python3 ./scripts/install_integration.py ${{ matrix.integration }} $VERSION
          python3 ./scripts/dump_index_templates.py ${{ matrix.integration }}
          python3 ./scripts/dump_ingest.py ${{ matrix.integration }}
          python3 ./scripts/dump_kibana_objects.py ${{ matrix.integration }}

      - name: Group artifacts in directory artifacts
        run: |
          mkdir -p artifacts
          mv dev_tools_index.txt artifacts/
          mv dev_tools_ingest.txt artifacts/
          mv objects.ndjson artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: my-artifact
          path: artifacts/

      - name: Stop containers
        if: always()
        run: |
          cd molecule/setup/es_kb_fleet
          STACK_VERSION=${{ matrix.version }} ./elastic-container.sh destroy
